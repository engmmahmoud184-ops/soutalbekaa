<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | صوت البقاع</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<div class="login-page" id="loginPage"><div class="login-card"><img src="assets/logo.jpeg" alt="صوت البقاع"><h1>لوحة إدارة صوت البقاع</h1><p>سجّل الدخول لإدارة الأخبار والمحتوى.</p><form id="loginForm"><label>البريد الإلكتروني<input type="email" id="email" required></label><label>كلمة المرور<input type="password" id="password" required></label><button>دخول آمن</button><small id="loginMessage"></small></form><a href="index.html">← العودة إلى الموقع</a></div></div>
<div class="dashboard" id="dashboard" hidden><aside><div class="side-brand"><img src="assets/logo.jpeg" alt=""><div><strong>صوت البقاع</strong><span>لوحة الإدارة</span></div></div><nav><button class="active">▦ لوحة الأخبار</button><a href="index.html">⌂ مشاهدة الموقع</a><button id="logoutButton">↪ تسجيل الخروج</button></nav></aside><main><header><div><span>إدارة المحتوى</span><h1>الأخبار والمقالات</h1></div><button class="primary" id="newArticle">＋ إضافة خبر جديد</button></header><p class="dashboard-message" id="dashboardMessage" hidden></p><section class="stats"><div><span>إجمالي الأخبار</span><strong id="totalCount">0</strong></div><div><span>الأخبار المنشورة</span><strong id="publishedCount">0</strong></div><div><span>المسودات</span><strong id="draftCount">0</strong></div></section><section class="panel"><div class="panel-head"><h2>كل الأخبار</h2><input type="search" id="adminSearch" placeholder="بحث..."></div><div class="table-wrap"><table><thead><tr><th>الخبر</th><th>القسم</th><th>الحالة</th><th>التاريخ</th><th>الإجراءات</th></tr></thead><tbody id="articleRows"></tbody></table></div></section></main></div>
<dialog id="editorDialog"><form id="articleForm"><div class="dialog-head"><div><span>محرّر الأخبار</span><h2 id="editorTitle">إضافة خبر جديد</h2></div><button type="button" id="closeEditor">×</button></div><input type="hidden" id="articleId"><div class="form-grid"><label class="wide">عنوان الخبر<input id="title" required maxlength="180"></label><label>التصنيف<select id="category"><option>محليات</option><option>سياسة</option><option>اقتصاد</option><option>رياضة</option><option>ثقافة</option><option>تكنولوجيا</option></select></label><label>الحالة<select id="status"><option value="published">منشور</option><option value="draft">مسودة</option></select></label><label class="wide">ملخص الخبر<textarea id="excerpt" required rows="2"></textarea></label><label class="wide">نص الخبر<textarea id="body" required rows="7"></textarea></label><label>اسم الكاتب<input id="author" required></label><label>صفة الكاتب<input id="authorRole" placeholder="مراسل البقاع"></label><label class="wide">صورة الكاتب (اختياري)<input id="authorImage" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">صورة الخبر الرئيسية<input id="mainImage" type="file" accept="image/jpeg,image/png,image/webp"><small id="mainImageHint">تُضغط الصورة تلقائيًا لتحسين سرعة الموقع.</small></label><label class="wide">رابط فيديو YouTube (اختياري)<input id="videoUrl" type="url"></label><label class="wide">صور الألبوم (اختياري)<input id="galleryImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>يمكن اختيار عدة صور، بحد أقصى 10 صور.</small></label><div class="checks wide"><label><input id="breaking" type="checkbox"> خبر عاجل</label><label><input id="featured" type="checkbox"> خبر بارز</label></div></div><div class="form-actions"><button type="button" class="secondary" id="cancelEditor">إلغاء</button><button class="primary" id="saveButton">حفظ الخبر</button></div><p id="formMessage"></p></form></dialog>
<script type="module" src="admin.js"></script></body></html>
